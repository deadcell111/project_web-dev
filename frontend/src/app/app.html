<nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
  <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
    <a routerLink="/feed" class="text-lg font-bold text-gray-900 hover:text-blue-600 transition-colors">
      Lost&Found <span class="text-sm font-normal text-gray-500">KBTU</span>
    </a>

    <div class="flex items-center gap-3">
      <a routerLink="/feed" routerLinkActive="text-blue-600" class="text-sm text-gray-600 hover:text-gray-900 transition-colors">Feed</a>

      @if (isLoggedIn$ | async) {
        <a routerLink="/post" routerLinkActive="text-blue-600" class="text-sm text-gray-600 hover:text-gray-900 transition-colors">Post</a>
        <a routerLink="/my-items" routerLinkActive="text-blue-600" class="text-sm text-gray-600 hover:text-gray-900 transition-colors">My Items</a>
        <span class="text-sm text-gray-400">|</span>
        <span class="text-sm text-gray-700">{{ (currentUser$ | async)?.username }}</span>
        <button (click)="logout()" class="text-sm text-red-500 hover:text-red-700 transition-colors cursor-pointer">Logout</button>
      } @else {
        <a routerLink="/login" routerLinkActive="text-blue-600" class="text-sm text-gray-600 hover:text-gray-900 transition-colors">Login</a>
        <a routerLink="/register" routerLinkActive="text-blue-600" class="px-3 py-1.5 bg-blue-600 text-white text-sm rounded-md hover:bg-blue-700 transition-colors">Register</a>
      }
    </div>
  </div>
</nav>

<main class="max-w-5xl mx-auto px-4 py-6">
  <router-outlet />
</main>
